name: CI
on: [push, pull_request]
# Read-only: tests need no write access.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
        with:
          python-version: ${{ matrix.python }}
      # No test reaches the network: the repositories are made up by the tests.
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
  # The GitHub Action as a user's workflow runs it, on the example repository.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rs
        uses: ./
        with:
          path: examples/paper-code
          badge: ${{ runner.temp }}/badge.svg
      - name: The score and the badge are what the README shows
        env:
          SCORE: ${{ steps.rs.outputs.score }}
          BADGE: ${{ runner.temp }}/badge.svg
        run: |
          grep -q "repro-score: paper-code: $SCORE/100" README.md
          grep -q "$SCORE/100" "$BADGE"
      - name: A minimum it does not reach fails the step
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: examples/paper-code
          min-score: "100"
      - run: test "${{ steps.strict.outcome }}" = failure
  # The released Action by its tag, as another repository's workflow uses it (our own tag, on purpose not pinned to
  # a commit: this job checks that what users get from @v0 works)
  released-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rs
        uses: zch6a/repro-score@v0
        with:
          path: examples/paper-code
      - env:
          SCORE: ${{ steps.rs.outputs.score }}
        run: test "$SCORE" -ge 0 && test "$SCORE" -le 100
