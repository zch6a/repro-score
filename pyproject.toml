[project]
name = "repro-score"
version = "0.2.0"
description = "How well a research code repository lets someone reproduce its paper: dependencies and their versions, instructions, training and evaluation code, trained models and data, seeds, compute, licence, notebooks. Read from the files, nothing run; a score, the evidence, a badge and a GitHub Action."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["reproducibility", "research", "machine-learning", "papers", "checklist", "github-action", "badge", "open-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# No dependencies: the standard library reads the files.
dependencies = []

[project.urls]
Homepage = "https://github.com/zch6a/repro-score"
Issues = "https://github.com/zch6a/repro-score/issues"

[project.scripts]
repro-score = "repro_score.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repro_score"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/repro_score"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter wraps the code; the advice sentences stay whole
